[project]
name = "nanogpt"
version = "0.1.0"
description = "nanoGPT 学习 fork：char-level 训练 + 练习"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
]

# 国内直连清华源，以后 uv sync / uv add 不用每次加 -i
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
